[package]
name = "clashr"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "crates/ipc", "crates/service"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1"

[dependencies]
clashr-ipc = { path = "crates/ipc", features = ["async"] }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
dirs-next = "2"
base64 = "0.22"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tokio.workspace = true
once_cell.workspace = true
urlencoding = "2"
